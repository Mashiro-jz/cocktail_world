name: coctail_world
description: "Cocktail World is a Flutter application that provides information about various cocktails, including recipes, ingredients, and preparation methods. It allows users to explore different cocktail options and discover new drinks to try."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
